# Every value here can be overridden by an environment variable using Spring's relaxed binding,
# e.g. notes.attachments.dir -> NOTES_ATTACHMENTS_DIR, notes.cors.allowed-origins -> NOTES_CORS_ALLOWED_ORIGINS.
server:
  port: ${NOTES_PORT:8080}
  address: ${NOTES_ADDRESS:0.0.0.0}

spring:
  application:
    name: team-notes-service
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # The service enforces notes.attachments.max-size itself while streaming, so the servlet limit is off.
      max-file-size: -1
      max-request-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

notes:
  store:
    # Set NOTES_STORE_SNAPSHOT_PATH (or this key) to persist the in-memory store as JSON across restarts.
    # Unset keeps everything in memory. Ignored under the cassandra profile.
    snapshot-path:
  security:
    bcrypt-strength: 10
  admin-users:
    - alice
  seed:
    enabled: true
    users:
      - { username: alice, password: alice-pw, display-name: Alice Ahmed }
      - { username: bob, password: bob-pw, display-name: Bob Baptiste }
      - { username: carol, password: carol-pw, display-name: Carol Chen }
    teams:
      - name: platform
        members:
          - { username: alice, role: ADMIN }
          - { username: bob, role: MEMBER }
      - name: data
        members:
          - { username: bob, role: ADMIN }
          - { username: carol, role: MEMBER }
  sse:
    heartbeat: 15s
    timeout: 30m
  limits:
    title-max-chars: 200
    body-max-chars: 20000
    tags-max: 20
    entry-body-max-chars: 5000
    entries-max: 500
    attachments-max: 20
    filename-max-chars: 255
    team-name-max-chars: 100
  attachments:
    dir: ./data/attachments
    max-size: 10MB
    allowed-types:
      - application/pdf
      - text/plain
      - text/markdown
      - image/png
      - image/jpeg
    extract-max-chars: 100000
  search:
    reindex-on-startup: true
  cors:
    allowed-origins:
      - http://localhost:3000

logging:
  level:
    io.github.jeffromine.notes: INFO
